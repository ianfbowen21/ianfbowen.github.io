# Jekyll configuration for GitHub Pages
# Custom layout in _layouts/default.html and styles in assets/css/style.scss
# (no remote theme needed)

title: Ian Francis Bowen Martín
description: Mathematics student at UPC · Quantitative Analysis · Numerical methods and software
lang: en

github_username: ianfbowen21

# Sidebar photo (remove this line to hide it)
logo: /assets/final.png

# Apply the custom layout to every page
defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-seo-tag

# Keep source files out of the published site
exclude:
  - "*.tex"
  - "references/"
  - Gemfile
  - Gemfile.lock
